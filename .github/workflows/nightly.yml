name: Nightly update

on:
  schedule:
    - cron: "0 7 * * *"        # 07:00 UTC = 02:00 in New York (03:00 in summer)
  workflow_dispatch:            # the "Run workflow" button
  push:
    branches: [main]
    paths: ["site/index.html", "collector/**", ".github/workflows/**"]

permissions:
  contents: write               # save tonight's data back to the repository
  pages: write                  # publish the site
  id-token: write
  actions: read                 # lets deploy-pages find the uploaded site

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # 1. Collect the data, save it, and package the site.
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Collect tonight's data
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          PATCH_INVENTORY: ${{ secrets.PATCH_INVENTORY }}   # private: platforms and versions we run
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python collector/run.py

      - name: Save the data in the repository
        if: github.event_name != 'push'
        run: |
          git config user.name "nightly-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git commit -m "Nightly data $(date -u +%F)"; then
            # Someone may have pushed (e.g. an overrides.json edit) while we ran.
            git pull --rebase -X theirs origin main
            git push
          else
            echo "Nothing new tonight"
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # 2. Publish the packaged site. A separate job, so the upload is finished
  #    and visible before deploy-pages looks for it.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # 3. Fail the run (GitHub emails you) if most sources failed tonight.
  health:
    needs: update
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main             # includes tonight's saved data
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python collector/check_health.py
